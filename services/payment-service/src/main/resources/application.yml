spring:
  application:
    name: payment-service

server:
  port: ${SERVER_PORT:8082}

pulseops:
  api:
    base-url: ${PULSEOPS_API_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always