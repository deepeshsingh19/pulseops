[project]
name = "pulseops-ai"
version = "0.1.0"
description = "ML and AI services for PulseOps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "scikit-learn>=1.7.0",
    "numpy>=2.3.0",
    "pydantic>=2.11.0"
]

[dependency-groups]
dev = [
    "pytest>=8.4.0"
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"